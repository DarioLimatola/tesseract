[package]
name = "tesseract-core"
description = "Tesseract engine: bit entities, counting units, blocks, learning and structure policy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["threads"]
# Batch evaluation across examples on several threads.
threads = ["dep:rayon"]

[dependencies]
rayon = { version = "1", optional = true }

[dev-dependencies]
proptest = "1"
rayon = "1"
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "kernels"
harness = false

[lints]
workspace = true
